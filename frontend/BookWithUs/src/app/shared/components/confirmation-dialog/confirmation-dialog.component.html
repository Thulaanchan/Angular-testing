@if (isOpen) {
  <div class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 sm:p-6" role="dialog" aria-modal="true">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200/80 max-w-md w-full p-6 text-left transform transition-all">
      <div class="flex items-start gap-4">
        <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0"
          [class.bg-rose-100]="type === 'danger'"
          [class.text-rose-600]="type === 'danger'"
          [class.bg-amber-100]="type === 'warning'"
          [class.text-amber-600]="type === 'warning'"
          [class.bg-blue-100]="type === 'info'"
          [class.text-blue-600]="type === 'info'">
          @if (type === 'danger') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          } @else if (type === 'warning') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
        </div>
        <div>
          <h3 class="text-lg font-bold text-slate-900">{{ title }}</h3>
          <p class="text-sm text-slate-500 mt-1">{{ message }}</p>
        </div>
      </div>

      <div class="mt-6 flex items-center justify-end gap-3">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isLoading"
          class="px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 rounded-xl transition-colors disabled:opacity-50">
          {{ cancelText }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="isLoading"
          class="px-4 py-2 text-sm font-semibold text-white rounded-xl shadow-xs transition-colors flex items-center gap-2 disabled:opacity-50"
          [class.bg-rose-600]="type === 'danger'"
          [class.hover:bg-rose-700]="type === 'danger'"
          [class.bg-amber-600]="type === 'warning'"
          [class.hover:bg-amber-700]="type === 'warning'"
          [class.bg-purple-600]="type === 'info'"
          [class.hover:bg-purple-700]="type === 'info'">
          @if (isLoading) {
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          }
          <span>{{ confirmText }}</span>
        </button>
      </div>
    </div>
  </div>
}
