<div class="relative">
  <button (click)="toggle()" type="button" aria-label="Notifications"
          class="relative p-2 text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-full transition focus:outline-none">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
    @if ((unreadCount$ | async); as count) {
      @if (count > 0) {
        <span class="absolute top-1 right-1 flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-rose-500 rounded-full ring-2 ring-white">
          {{ count }}
        </span>
      }
    }
  </button>

  @if (isOpen) {
    <div class="fixed inset-0 z-30" (click)="close()"></div>
    <div class="absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-2xl shadow-xl border border-slate-200 py-3 z-40 animate-in fade-in slide-in-from-top-2">
      <div class="px-4 py-2 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="font-bold text-slate-900 text-sm">Notifications</span>
          <span class="px-2 py-0.5 text-xs font-semibold bg-brand-100 text-brand-700 rounded-full">
            {{ (unreadCount$ | async) || 0 }} new
          </span>
        </div>
        <button (click)="notificationService.markAllAsRead()" class="text-xs text-brand-600 hover:text-brand-700 font-medium">
          Mark all read
        </button>
      </div>

      <div class="max-h-72 overflow-y-auto divide-y divide-slate-100">
        <div class="p-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0 mt-0.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-xs font-semibold text-slate-900">Booking Confirmed</p>
              <p class="text-xs text-slate-500 line-clamp-2 mt-0.5">Your booking GTS-8829 for Rockstar Aniruth Musical Show has been confirmed.</p>
              <span class="text-[10px] text-slate-400 mt-1 block">2m ago</span>
            </div>
          </div>
        </div>

        <div class="p-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0 mt-0.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-xs font-semibold text-slate-900">Payment Completed</p>
              <p class="text-xs text-slate-500 line-clamp-2 mt-0.5">Simulated payment of LKR 33,000 received.</p>
              <span class="text-[10px] text-slate-400 mt-1 block">5m ago</span>
            </div>
          </div>
        </div>
      </div>

      <div class="px-4 pt-2.5 pb-1 border-t border-slate-100 text-center">
        <a routerLink="/customer/notifications" (click)="close()" class="text-xs font-medium text-brand-600 hover:text-brand-700">
          View all notifications →
        </a>
      </div>
    </div>
  }
</div>
