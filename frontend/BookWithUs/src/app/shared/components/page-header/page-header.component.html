<div class="mb-6">
  @if (breadcrumbs && breadcrumbs.length > 0) {
    <nav class="flex items-center gap-1.5 text-xs text-slate-500 mb-2" aria-label="Breadcrumb">
      @for (item of breadcrumbs; track item.label; let last = $last) {
        @if (!last && item.route) {
          <a [routerLink]="item.route" class="hover:text-purple-600 transition-colors">{{ item.label }}</a>
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        } @else {
          <span class="font-medium text-slate-800">{{ item.label }}</span>
        }
      }
    </nav>
  }

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ title }}</h1>
      @if (subtitle) {
        <p class="text-sm text-slate-500 mt-1">{{ subtitle }}</p>
      }
    </div>
    <div class="flex items-center gap-3">
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>
</div>
