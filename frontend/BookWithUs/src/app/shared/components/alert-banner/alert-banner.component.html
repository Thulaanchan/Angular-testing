@if (visible) {
  <div class="rounded-xl p-4 border transition-all"
    [class.bg-blue-50]="type === 'info'"
    [class.border-blue-200]="type === 'info'"
    [class.text-blue-900]="type === 'info'"
    [class.bg-emerald-50]="type === 'success'"
    [class.border-emerald-200]="type === 'success'"
    [class.text-emerald-900]="type === 'success'"
    [class.bg-amber-50]="type === 'warning'"
    [class.border-amber-200]="type === 'warning'"
    [class.text-amber-900]="type === 'warning'"
    [class.bg-rose-50]="type === 'error'"
    [class.border-rose-200]="type === 'error'"
    [class.text-rose-900]="type === 'error'">
    <div class="flex items-start gap-3">
      <div class="shrink-0 mt-0.5">
        @switch (type) {
          @case ('info') {
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
          @case ('success') {
            <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
          @case ('warning') {
            <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          }
          @case ('error') {
            <svg class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
        }
      </div>
      <div class="flex-1 text-sm">
        @if (title) {
          <h4 class="font-bold mb-0.5">{{ title }}</h4>
        }
        <div>
          @if (message) {
            <p>{{ message }}</p>
          }
          <ng-content></ng-content>
        </div>
      </div>
      @if (dismissible) {
        <button
          type="button"
          (click)="dismiss()"
          class="shrink-0 p-1 opacity-60 hover:opacity-100 transition-opacity rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      }
    </div>
  </div>
}
