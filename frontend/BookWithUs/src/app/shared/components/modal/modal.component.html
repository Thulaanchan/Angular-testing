@if (isOpen) {
  <div
    class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 sm:p-6"
    (click)="onBackdropClick($event)"
    tabindex="-1"
    role="dialog"
    aria-modal="true">
    <div
      class="bg-white rounded-2xl shadow-2xl border border-slate-200/80 w-full overflow-hidden transform transition-all flex flex-col max-h-[90vh]"
      [class]="sizeClasses">

      <!-- Header -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50 shrink-0">
        <div>
          <h3 class="text-lg font-bold text-slate-900">{{ title }}</h3>
          @if (subtitle) {
            <p class="text-xs text-slate-500 mt-0.5">{{ subtitle }}</p>
          }
        </div>
        @if (showClose) {
          <button
            type="button"
            (click)="closeModal()"
            class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        }
      </div>

      <!-- Body -->
      <div class="px-6 py-5 overflow-y-auto flex-1">
        <ng-content></ng-content>
      </div>

      <!-- Footer slot if projected -->
      <div class="px-6 py-4 bg-slate-50/80 border-t border-slate-100 flex justify-end items-center gap-3 shrink-0">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
