@if (overlay) {
  <div class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 flex flex-col items-center max-w-xs text-center">
      <svg [class]="sizeClasses + ' animate-spin ' + color" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      @if (message) {
        <p class="mt-3 text-sm font-medium text-slate-700">{{ message }}</p>
      }
    </div>
  </div>
} @else {
  <div class="flex flex-col items-center justify-center p-8 text-center">
    <svg [class]="sizeClasses + ' animate-spin ' + color" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    @if (message) {
      <p class="mt-3 text-sm font-medium text-slate-500">{{ message }}</p>
    }
  </div>
}
