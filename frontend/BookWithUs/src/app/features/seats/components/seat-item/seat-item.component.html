<button
  type="button"
  (click)="onSelect()"
  (mouseenter)="onHover()"
  (mouseleave)="onLeave()"
  [disabled]="seat.status !== 'Available'"
  [appSeatStatus]="seat.status"
  [attr.aria-label]="seat.seatCode | seatLabel"
  [title]="(seat.seatCode | seatLabel) + ' - LKR ' + (seat.adultPrice | number:'1.2-2')"
  [ngClass]="{
    'bg-purple-600 text-white ring-2 ring-purple-300 scale-110 shadow-md': isSelected,
    'bg-slate-700 text-slate-200 hover:bg-purple-500 hover:text-white cursor-pointer': !isSelected && seat.status === 'Available',
    'bg-amber-500/40 text-amber-200 cursor-not-allowed opacity-75': seat.status === 'Held',
    'bg-slate-800 text-slate-600 opacity-40 cursor-not-allowed': seat.status === 'Booked' || seat.status === 'Occupied'
  }"
  class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg text-[10px] font-bold transition-all duration-150 flex items-center justify-center relative">
  {{ seat.number }}
</button>
