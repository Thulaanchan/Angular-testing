<div class="space-y-6">
  <!-- Stepper Header -->
  <app-booking-stepper [currentStep]="2"></app-booking-stepper>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Left 2 Cols: Parking Bay Layout & Vehicle Type Selector -->
    <div class="lg:col-span-2 space-y-6">
      <!-- Vehicle Type Picker Card -->
      <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-xs">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-base font-bold text-slate-900">Select Vehicle Type & Parking Space</h2>
            <p class="text-xs text-slate-500 mt-0.5">Guaranteed reserved parking stall at {{ bookingState.currentState.event?.venueName || 'Venue' }}</p>
          </div>
          <button
            type="button"
            (click)="skipParking()"
            class="text-xs font-semibold text-slate-500 hover:text-purple-600 hover:underline">
            Skip Parking &rarr;
          </button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          @for (vt of vehicleTypes; track vt.type) {
            <button
              type="button"
              (click)="setVehicleType(vt.type)"
              class="p-3.5 rounded-xl border text-left transition-all"
              [class.border-purple-600]="selectedVehicleType === vt.type"
              [class.bg-purple-50/50]="selectedVehicleType === vt.type"
              [class.ring-2]="selectedVehicleType === vt.type"
              [class.ring-purple-200]="selectedVehicleType === vt.type"
              [class.border-slate-200]="selectedVehicleType !== vt.type"
              [class.bg-slate-50/50]="selectedVehicleType !== vt.type"
              [class.hover:bg-slate-100]="selectedVehicleType !== vt.type">
              <span class="block text-xs font-bold text-slate-900">{{ vt.label }}</span>
              <span class="text-xs font-black text-purple-700 mt-1 block">{{ vt.fee | currency:'LKR':'symbol':'1.0-0' }}</span>
              <span class="text-[10px] text-slate-400 block mt-0.5">Fixed event rate</span>
            </button>
          }
        </div>
      </div>

      <!-- Parent ParkingMapComponent -->
      @if (isLoadingEvent) {
        <div class="py-20 bg-white rounded-2xl border border-slate-200/80 p-6 flex justify-center">
          <app-loading-spinner message="Loading event parking details..."></app-loading-spinner>
        </div>
      } @else {
        <app-parking-map
          [eventId]="eventId"
          [selectedVehicleType]="selectedVehicleType"
          (conflictOccurred)="onConflict($event)">
        </app-parking-map>
      }

      <!-- Navigation CTAs at Bottom of Screen -->
      <div class="flex items-center justify-between pt-2">
        <a routerLink="/booking/seats" class="px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-100 rounded-xl transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
          <span>Back to Seats</span>
        </a>

        <div class="flex items-center gap-3">
          <button
            type="button"
            (click)="skipParking()"
            class="px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
            Skip Parking
          </button>
          <button
            type="button"
            (click)="continueToReview()"
            class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-xl shadow-xs transition">
            Continue to Review &rarr;
          </button>
        </div>
      </div>
    </div>

    <!-- Right 1 Col: Live Booking Summary -->
    <div>
      <app-live-booking-summary
        actionLabel="Continue to Review"
        [canProceed]="true"
        (proceed)="continueToReview()">
      </app-live-booking-summary>
    </div>
  </div>

  <!-- 409 Conflict Dialog -->
  <app-confirmation-dialog
    [isOpen]="showConflictDialog"
    title="Parking Stall Conflict (409)"
    [message]="conflictMessage || 'The selected parking stall was recently reserved by another customer. Please pick an alternative slot or continue without parking.'"
    confirmText="Refresh Parking Stalls"
    cancelText="Dismiss"
    type="warning"
    (confirm)="onRefreshAfterConflict()"
    (cancel)="showConflictDialog = false">
  </app-confirmation-dialog>
</div>
