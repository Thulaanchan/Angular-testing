<div class="min-h-screen bg-gradient-to-br from-purple-50 via-white to-indigo-50 flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans">
  <div class="w-full max-w-lg">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-purple-600 flex items-center justify-center text-white shadow-lg shadow-purple-200">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
          </svg>
        </div>
        <span class="text-2xl font-black text-slate-900 tracking-tight">Book<span class="text-purple-600">WithUs</span></span>
      </a>
      <h2 class="text-2xl font-bold text-slate-900 mt-6 tracking-tight">Create your account</h2>
      <p class="text-sm text-slate-500 mt-1.5">Join BookWithUs to reserve event seats and guaranteed parking slots</p>
    </div>

    <!-- Registration Card -->
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 p-8 sm:p-10">
      @if (errorMessage) {
        <div class="mb-6">
          <app-alert-banner type="error" [message]="errorMessage" [dismissible]="true" (dismissed)="errorMessage = ''"></app-alert-banner>
        </div>
      }

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Full Name</label>
          <input
            type="text"
            formControlName="fullName"
            placeholder="John Doe"
            class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 focus:bg-white transition-all placeholder:text-slate-400"
            [class.border-rose-300]="registerForm.get('fullName')?.touched && registerForm.get('fullName')?.invalid" />
          <app-form-error [control]="registerForm.get('fullName')" fieldName="Full name"></app-form-error>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
          <input
            type="email"
            formControlName="email"
            placeholder="john@example.com"
            class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 focus:bg-white transition-all placeholder:text-slate-400"
            [class.border-rose-300]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" />
          <app-form-error [control]="registerForm.get('email')" fieldName="Email"></app-form-error>
        </div>

        <!-- Phone Number -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Phone Number</label>
          <input
            type="tel"
            formControlName="phoneNumber"
            placeholder="+1 (555) 000-0000"
            class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 focus:bg-white transition-all placeholder:text-slate-400"
            [class.border-rose-300]="registerForm.get('phoneNumber')?.touched && registerForm.get('phoneNumber')?.invalid" />
          <app-form-error [control]="registerForm.get('phoneNumber')" fieldName="Phone number"></app-form-error>
        </div>

        <!-- Password Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Min. 8 characters"
              class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 focus:bg-white transition-all placeholder:text-slate-400"
              [class.border-rose-300]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" />
            <app-form-error [control]="registerForm.get('password')" fieldName="Password"></app-form-error>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Confirm Password</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="Repeat password"
              class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 focus:bg-white transition-all placeholder:text-slate-400"
              [class.border-rose-300]="registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.invalid" />
            <app-form-error [control]="registerForm.get('confirmPassword')" fieldName="Password confirmation"></app-form-error>
          </div>
        </div>

        <!-- Terms checkbox -->
        <div class="pt-2">
          <div class="flex items-start">
            <input
              id="agreeTerms"
              type="checkbox"
              formControlName="agreeTerms"
              class="w-4 h-4 mt-0.5 rounded text-purple-600 focus:ring-purple-500 border-slate-300" />
            <label for="agreeTerms" class="ml-2 text-xs text-slate-600 leading-relaxed select-none cursor-pointer">
              I agree to the <span class="text-purple-600 font-semibold hover:underline">Terms of Service</span> and <span class="text-purple-600 font-semibold hover:underline">Privacy Policy</span>
            </label>
          </div>
          <app-form-error [control]="registerForm.get('agreeTerms')" customMessage="You must agree to the Terms of Service"></app-form-error>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full mt-4 py-3.5 px-4 bg-purple-600 hover:bg-purple-700 disabled:opacity-60 text-white font-semibold rounded-xl shadow-lg shadow-purple-200 transition-all flex items-center justify-center gap-2">
          @if (isLoading) {
            <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Creating account...</span>
          } @else {
            <span>Create Account</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          }
        </button>
      </form>

      <!-- Back to Login -->
      <div class="mt-6 text-center text-xs text-slate-500">
        Already have an account?
        <a routerLink="/auth/login" class="font-semibold text-purple-600 hover:text-purple-700 transition-colors ml-1">
          Sign in
        </a>
      </div>
    </div>
  </div>
</div>
