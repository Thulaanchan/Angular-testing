<div class="min-h-screen bg-gradient-to-br from-purple-50 via-white to-indigo-50 flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 p-8 sm:p-10 text-center">
      <div class="w-16 h-16 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xs">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>

      <h2 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Check your email</h2>
      <p class="text-sm text-slate-500 mb-6 leading-relaxed">
        We've sent a verification link to <strong class="text-slate-800 font-semibold">{{ email }}</strong>.
        Please click the link in the email to activate your BookWithUs account.
      </p>

      @if (resendSuccess) {
        <div class="mb-4 p-3 bg-emerald-50 text-emerald-700 text-xs rounded-xl border border-emerald-200">
          A new verification link has been sent to your email.
        </div>
      }

      <div class="space-y-3">
        <a routerLink="/auth/login" class="w-full py-3 px-4 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl shadow-md shadow-purple-200 transition-all block">
          Continue to Sign In
        </a>

        <button
          type="button"
          (click)="resendEmail()"
          [disabled]="isResending"
          class="w-full py-2.5 px-4 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 transition-colors">
          @if (isResending) {
            Sending new link...
          } @else {
            Didn't receive email? Click to resend
          }
        </button>
      </div>
    </div>
  </div>
</div>
