<div class="min-h-screen bg-gradient-to-br from-purple-50 via-white to-indigo-50 flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-purple-600 flex items-center justify-center text-white shadow-lg shadow-purple-200">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
          </svg>
        </div>
        <span class="text-2xl font-black text-slate-900 tracking-tight">Book<span class="text-purple-600">WithUs</span></span>
      </a>
      <h2 class="text-2xl font-bold text-slate-900 mt-6 tracking-tight">Set new password</h2>
      <p class="text-sm text-slate-500 mt-1.5">Must be at least 8 characters long</p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 p-8 sm:p-10">
      @if (isSuccess) {
        <div class="text-center py-4">
          <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h3 class="text-lg font-bold text-slate-900 mb-2">Password reset successful!</h3>
          <p class="text-sm text-slate-500 mb-6">Your password has been changed. You can now sign in with your new credentials.</p>
          <a routerLink="/auth/login" class="inline-flex items-center justify-center w-full py-3.5 px-4 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl shadow-md transition-all">
            Sign In Now
          </a>
        </div>
      } @else {
        @if (errorMessage) {
          <div class="mb-6">
            <app-alert-banner type="error" [message]="errorMessage" [dismissible]="true" (dismissed)="errorMessage = ''"></app-alert-banner>
          </div>
        }

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-5">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">New Password</label>
            <input
              type="password"
              formControlName="password"
              placeholder="••••••••"
              class="w-full px-4 py-3 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 focus:bg-white transition-all placeholder:text-slate-400"
              [class.border-rose-300]="resetForm.get('password')?.touched && resetForm.get('password')?.invalid" />
            <app-form-error [control]="resetForm.get('password')" fieldName="Password"></app-form-error>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Confirm New Password</label>
            <input
              type="password"
              formControlName="confirmPassword"
              placeholder="••••••••"
              class="w-full px-4 py-3 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 focus:bg-white transition-all placeholder:text-slate-400"
              [class.border-rose-300]="resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.invalid" />
            <app-form-error [control]="resetForm.get('confirmPassword')" fieldName="Password confirmation"></app-form-error>
          </div>

          <button
            type="submit"
            [disabled]="isLoading"
            class="w-full py-3.5 px-4 bg-purple-600 hover:bg-purple-700 disabled:opacity-60 text-white font-semibold rounded-xl shadow-lg shadow-purple-200 transition-all flex items-center justify-center gap-2">
            @if (isLoading) {
              <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Resetting password...</span>
            } @else {
              <span>Update Password</span>
            }
          </button>
        </form>
      }
    </div>
  </div>
</div>
