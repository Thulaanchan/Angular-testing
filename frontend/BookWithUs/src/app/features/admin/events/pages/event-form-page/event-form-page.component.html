<div class="max-w-4xl mx-auto space-y-6">
  <div>
    <a routerLink="/admin/events" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-purple-600 transition mb-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
      <span>Back to Events</span>
    </a>
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ isEditMode ? 'Edit Event' : 'Create New Event' }}</h1>
    <p class="text-xs text-slate-500 mt-1">Configure event metadata, venue scheduling, pricing tiers, and stage setup</p>
  </div>

  @if (errorMessage) {
    <app-alert-banner type="error" [message]="errorMessage" [dismissible]="true" (dismissed)="errorMessage = ''"></app-alert-banner>
  }

  <div class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-xs">
    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Title -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Event Title</label>
        <input
          type="text"
          formControlName="title"
          placeholder="e.g. Coldplay - Music of the Spheres Tour 2026"
          class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
        <app-form-error [control]="eventForm.get('title')" fieldName="Title"></app-form-error>
      </div>

      <!-- Category & Venue Dropdowns -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Event Category</label>
          <select
            formControlName="categoryId"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 text-slate-700">
            @for (c of categories; track c.categoryId) {
              <option [value]="c.categoryId">{{ c.name }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Hosting Venue</label>
          <select
            formControlName="venueId"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 text-slate-700">
            @for (v of venues; track v.venueId) {
              <option [value]="v.venueId">{{ v.name }} (Cap: {{ v.capacity }})</option>
            }
          </select>
        </div>
      </div>

      <!-- Date & Times -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Event Date</label>
          <input
            type="date"
            formControlName="eventDate"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
          <app-form-error [control]="eventForm.get('eventDate')" fieldName="Event date"></app-form-error>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Start Time</label>
          <input
            type="time"
            formControlName="startTime"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">End Time</label>
          <input
            type="time"
            formControlName="endTime"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
        </div>
      </div>

      <!-- Price & Poster -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Base Ticket Price ($)</label>
          <input
            type="number"
            formControlName="baseTicketPrice"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
          <app-form-error [control]="eventForm.get('baseTicketPrice')" fieldName="Base price"></app-form-error>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Poster Image URL</label>
          <input
            type="text"
            formControlName="posterImageUrl"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
        </div>
      </div>

      <!-- Poster Preview -->
      @if (eventForm.value.posterImageUrl) {
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center gap-4">
          <img [src]="eventForm.value.posterImageUrl" class="w-16 h-16 rounded-lg object-cover bg-slate-200" alt="Poster preview" />
          <div class="text-xs">
            <span class="font-bold text-slate-800">Poster Image Preview</span>
            <p class="text-slate-400 text-[11px] truncate max-w-md">{{ eventForm.value.posterImageUrl }}</p>
          </div>
        </div>
      }

      <!-- Stage Layout Picker -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Stage Layout Type</label>
        <div class="grid grid-cols-3 gap-3">
          <label class="p-3.5 rounded-xl border flex flex-col items-center text-center cursor-pointer transition"
            [class.border-purple-600]="eventForm.value.stageLayout === 'EndStage'"
            [class.bg-purple-50/40]="eventForm.value.stageLayout === 'EndStage'">
            <input type="radio" formControlName="stageLayout" value="EndStage" class="sr-only" />
            <span class="font-bold text-xs text-slate-900">End Stage</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Stage at arena north end</span>
          </label>

          <label class="p-3.5 rounded-xl border flex flex-col items-center text-center cursor-pointer transition"
            [class.border-purple-600]="eventForm.value.stageLayout === 'CenterStage'"
            [class.bg-purple-50/40]="eventForm.value.stageLayout === 'CenterStage'">
            <input type="radio" formControlName="stageLayout" value="CenterStage" class="sr-only" />
            <span class="font-bold text-xs text-slate-900">Center Stage (360°)</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Surrounded arena layout</span>
          </label>

          <label class="p-3.5 rounded-xl border flex flex-col items-center text-center cursor-pointer transition"
            [class.border-purple-600]="eventForm.value.stageLayout === 'Theatre'"
            [class.bg-purple-50/40]="eventForm.value.stageLayout === 'Theatre'">
            <input type="radio" formControlName="stageLayout" value="Theatre" class="sr-only" />
            <span class="font-bold text-xs text-slate-900">Proscenium Theatre</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Tiered acoustic hall</span>
          </label>
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Description & Highlights</label>
        <textarea
          formControlName="description"
          rows="4"
          placeholder="Detailed description of performers, timings, gate entry guidelines..."
          class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600"></textarea>
        <app-form-error [control]="eventForm.get('description')" fieldName="Description"></app-form-error>
      </div>

      <!-- Submit Buttons -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
        <a routerLink="/admin/events" class="px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
          Cancel
        </a>
        <button
          type="submit"
          [disabled]="isLoading"
          class="px-6 py-2.5 bg-purple-600 hover:bg-purple-700 disabled:opacity-60 text-white font-semibold text-xs rounded-xl shadow-xs transition">
          {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Event' : 'Create Event') }}
        </button>
      </div>
    </form>
  </div>
</div>
