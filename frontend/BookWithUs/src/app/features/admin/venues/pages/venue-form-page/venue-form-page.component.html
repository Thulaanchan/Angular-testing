<div class="max-w-3xl mx-auto space-y-6">
  <div>
    <a routerLink="/admin/venues" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-purple-600 transition mb-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
      <span>Back to Venues</span>
    </a>
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ isEditMode ? 'Edit Venue' : 'Create New Venue' }}</h1>
    <p class="text-xs text-slate-500 mt-1">Define venue capacity, parking spaces, and location metadata</p>
  </div>

  @if (errorMessage) {
    <app-alert-banner type="error" [message]="errorMessage" [dismissible]="true" (dismissed)="errorMessage = ''"></app-alert-banner>
  }

  <div class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-xs">
    <form [formGroup]="venueForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Venue Name</label>
        <input
          type="text"
          formControlName="name"
          placeholder="e.g. Wembley Stadium"
          class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
        <app-form-error [control]="venueForm.get('name')" fieldName="Venue name"></app-form-error>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Full Address / Location</label>
        <input
          type="text"
          formControlName="location"
          placeholder="e.g. London HA9 0WS, United Kingdom"
          class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
        <app-form-error [control]="venueForm.get('location')" fieldName="Location"></app-form-error>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Total Seat Capacity</label>
          <input
            type="number"
            formControlName="capacity"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
          <app-form-error [control]="venueForm.get('capacity')" fieldName="Capacity"></app-form-error>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Total Parking Stalls</label>
          <input
            type="number"
            formControlName="parkingCapacity"
            class="w-full px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600" />
          <app-form-error [control]="venueForm.get('parkingCapacity')" fieldName="Parking capacity"></app-form-error>
        </div>
      </div>

      <div class="pt-2">
        <label class="inline-flex items-center gap-2 cursor-pointer">
          <input
            type="checkbox"
            formControlName="isActive"
            class="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 border-slate-300" />
          <span class="text-xs font-medium text-slate-700">Venue is Active and Bookable</span>
        </label>
      </div>

      <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
        <a routerLink="/admin/venues" class="px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
          Cancel
        </a>
        <button
          type="submit"
          [disabled]="isLoading"
          class="px-6 py-2.5 bg-purple-600 hover:bg-purple-700 disabled:opacity-60 text-white font-semibold text-xs rounded-xl shadow-xs transition">
          {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Venue' : 'Create Venue') }}
        </button>
      </div>
    </form>
  </div>
</div>
