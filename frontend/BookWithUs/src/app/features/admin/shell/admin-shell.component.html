<div class="flex min-h-screen bg-slate-50 font-sans">
  <!-- Left Admin Sidebar -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- Right Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Top Admin Bar -->
    <header class="h-16 bg-white border-b border-slate-200/80 px-6 lg:px-8 flex items-center justify-between shrink-0 sticky top-0 z-20">
      <div class="flex items-center gap-4 flex-1 max-w-md">
        <div class="relative w-full">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            type="text"
            placeholder="Search events, bookings, customers..."
            class="w-full pl-9 pr-4 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 transition-all placeholder:text-slate-400" />
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-semibold bg-purple-50 text-purple-700 border border-purple-200">
          Admin Portal
        </span>
        <app-notification-bell></app-notification-bell>
        <div class="h-5 w-px bg-slate-200"></div>
        <app-user-menu></app-user-menu>
      </div>
    </header>

    <!-- Main Content Outlet -->
    <main class="flex-1 overflow-y-auto p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
